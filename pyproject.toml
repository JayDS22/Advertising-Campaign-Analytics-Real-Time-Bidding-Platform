[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-rtb"
version = "1.0.0"
description = "Advertising campaign analytics & real-time bidding platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jay Guwalani" }]
license = { text = "MIT" }

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
