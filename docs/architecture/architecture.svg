<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gradBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#161e3c"/>
    </linearGradient>
    <linearGradient id="gradAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ea8ff"/>
      <stop offset="100%" stop-color="#56e0c2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8a93b8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1300" height="720" fill="url(#gradBg)"/>

  <!-- Title -->
  <text x="40" y="48" fill="#e6ebff" font-size="22" font-weight="700">Atlas RTB - Lambda Architecture</text>
  <text x="40" y="72" fill="#8a93b8" font-size="13">Real-Time Bidding | Streaming Analytics | Causal Inference | Advertiser Reporting</text>

  <!-- ============== INGESTION ============== -->
  <g filter="url(#shadow)">
    <rect x="40" y="110" width="220" height="110" rx="12" fill="#1c264a" stroke="url(#gradAccent)" stroke-width="2"/>
    <text x="150" y="142" fill="#e6ebff" font-size="14" font-weight="700" text-anchor="middle">Ad Exchanges + SSPs</text>
    <text x="150" y="166" fill="#8a93b8" font-size="11" text-anchor="middle">Bid requests | 1M+/sec</text>
    <text x="150" y="184" fill="#8a93b8" font-size="11" text-anchor="middle">OpenRTB 2.5</text>
    <text x="150" y="202" fill="#8a93b8" font-size="11" text-anchor="middle">Floor price | slot meta</text>
  </g>

  <!-- ============== RTB ENGINE ============== -->
  <g filter="url(#shadow)">
    <rect x="320" y="110" width="220" height="110" rx="12" fill="#1c264a" stroke="#6ea8ff" stroke-width="2"/>
    <text x="430" y="138" fill="#6ea8ff" font-size="13" font-weight="700" text-anchor="middle">RTB ENGINE (P99 &lt;50ms)</text>
    <text x="430" y="160" fill="#e6ebff" font-size="11" text-anchor="middle">Eligibility | Targeting | Pacing</text>
    <text x="430" y="178" fill="#e6ebff" font-size="11" text-anchor="middle">CF score | pCTR | EV ranking</text>
    <text x="430" y="196" fill="#e6ebff" font-size="11" text-anchor="middle">2nd-price clearing</text>
  </g>

  <!-- ============== KAFKA ============== -->
  <g filter="url(#shadow)">
    <rect x="600" y="110" width="220" height="110" rx="12" fill="#1c264a" stroke="#56e0c2" stroke-width="2"/>
    <text x="710" y="138" fill="#56e0c2" font-size="13" font-weight="700" text-anchor="middle">KAFKA / MSK</text>
    <text x="710" y="160" fill="#e6ebff" font-size="11" text-anchor="middle">3-replica partitions</text>
    <text x="710" y="178" fill="#e6ebff" font-size="11" text-anchor="middle">topics: bid | imp | click | conv</text>
    <text x="710" y="196" fill="#e6ebff" font-size="11" text-anchor="middle">gzip | acks=all</text>
  </g>

  <!-- ============== Spark + Feature Store ============== -->
  <g filter="url(#shadow)">
    <rect x="880" y="80" width="220" height="80" rx="12" fill="#1c264a" stroke="#6ea8ff" stroke-width="2"/>
    <text x="990" y="106" fill="#6ea8ff" font-size="13" font-weight="700" text-anchor="middle">SPARK STREAMING</text>
    <text x="990" y="126" fill="#e6ebff" font-size="11" text-anchor="middle">Tumbling windows</text>
    <text x="990" y="144" fill="#e6ebff" font-size="11" text-anchor="middle">CTR | CVR | pacing aggregates</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="880" y="180" width="220" height="80" rx="12" fill="#1c264a" stroke="#6ea8ff" stroke-width="2"/>
    <text x="990" y="206" fill="#6ea8ff" font-size="13" font-weight="700" text-anchor="middle">REDIS FEATURE STORE</text>
    <text x="990" y="226" fill="#e6ebff" font-size="11" text-anchor="middle">User embeddings | segments</text>
    <text x="990" y="244" fill="#e6ebff" font-size="11" text-anchor="middle">&lt;1ms lookups</text>
  </g>

  <!-- arrows row 1 -->
  <line x1="260" y1="165" x2="318" y2="165" stroke="#8a93b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="165" x2="598" y2="165" stroke="#8a93b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="135" x2="878" y2="115" stroke="#8a93b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="195" x2="878" y2="215" stroke="#8a93b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="990" y1="180" x2="990" y2="160" stroke="#8a93b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="220" x2="430" y2="220" stroke="#56e0c2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="430" y1="220" x2="430" y2="218" stroke="#56e0c2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="234" fill="#56e0c2" font-size="10" text-anchor="middle">feature lookups</text>

  <!-- ============== BATCH LAYER ============== -->
  <text x="40" y="320" fill="#e6ebff" font-size="16" font-weight="700">Batch Layer</text>

  <g filter="url(#shadow)">
    <rect x="40" y="340" width="200" height="100" rx="12" fill="#1c264a" stroke="#56e0c2" stroke-width="2"/>
    <text x="140" y="368" fill="#56e0c2" font-size="13" font-weight="700" text-anchor="middle">S3 DATA LAKE</text>
    <text x="140" y="388" fill="#e6ebff" font-size="11" text-anchor="middle">Parquet | Snappy</text>
    <text x="140" y="406" fill="#e6ebff" font-size="11" text-anchor="middle">Hive: dt/hour/campaign</text>
    <text x="140" y="424" fill="#e6ebff" font-size="11" text-anchor="middle">62% cost reduction</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="280" y="340" width="200" height="100" rx="12" fill="#1c264a" stroke="#56e0c2" stroke-width="2"/>
    <text x="380" y="368" fill="#56e0c2" font-size="13" font-weight="700" text-anchor="middle">AIRFLOW</text>
    <text x="380" y="388" fill="#e6ebff" font-size="11" text-anchor="middle">200+ DAGs</text>
    <text x="380" y="406" fill="#e6ebff" font-size="11" text-anchor="middle">99.9% reliability</text>
    <text x="380" y="424" fill="#e6ebff" font-size="11" text-anchor="middle">SLA monitoring</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="520" y="340" width="200" height="100" rx="12" fill="#1c264a" stroke="#56e0c2" stroke-width="2"/>
    <text x="620" y="368" fill="#56e0c2" font-size="13" font-weight="700" text-anchor="middle">DBT</text>
    <text x="620" y="388" fill="#e6ebff" font-size="11" text-anchor="middle">500+ SQL models</text>
    <text x="620" y="406" fill="#e6ebff" font-size="11" text-anchor="middle">incremental + tested</text>
    <text x="620" y="424" fill="#e6ebff" font-size="11" text-anchor="middle">73% compute savings</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="760" y="340" width="200" height="100" rx="12" fill="#1c264a" stroke="#56e0c2" stroke-width="2"/>
    <text x="860" y="368" fill="#56e0c2" font-size="13" font-weight="700" text-anchor="middle">REDSHIFT</text>
    <text x="860" y="388" fill="#e6ebff" font-size="11" text-anchor="middle">32 facts | 128 dims</text>
    <text x="860" y="406" fill="#e6ebff" font-size="11" text-anchor="middle">Star schema</text>
    <text x="860" y="424" fill="#e6ebff" font-size="11" text-anchor="middle">RA3.4xlarge x 4</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1000" y="340" width="200" height="100" rx="12" fill="#1c264a" stroke="#56e0c2" stroke-width="2"/>
    <text x="1100" y="368" fill="#56e0c2" font-size="13" font-weight="700" text-anchor="middle">POWER BI</text>
    <text x="1100" y="388" fill="#e6ebff" font-size="11" text-anchor="middle">15+ KPIs</text>
    <text x="1100" y="406" fill="#e6ebff" font-size="11" text-anchor="middle">CPM | CPA | ROAS</text>
    <text x="1100" y="424" fill="#e6ebff" font-size="11" text-anchor="middle">Advertiser reporting</text>
  </g>

  <line x1="240" y1="390" x2="278" y2="390" stroke="#8a93b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="390" x2="518" y2="390" stroke="#8a93b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="390" x2="758" y2="390" stroke="#8a93b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960" y1="390" x2="998" y2="390" stroke="#8a93b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Kafka -> S3 sink -->
  <line x1="710" y1="220" x2="710" y2="320" stroke="#8a93b8" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="730" y="280" fill="#8a93b8" font-size="11">sink</text>

  <!-- ============== ML / Experimentation ============== -->
  <text x="40" y="500" fill="#e6ebff" font-size="16" font-weight="700">ML, Experimentation &amp; Causal Inference</text>

  <g filter="url(#shadow)">
    <rect x="40" y="520" width="240" height="120" rx="12" fill="#1c264a" stroke="#f5a623" stroke-width="2"/>
    <text x="160" y="548" fill="#f5a623" font-size="13" font-weight="700" text-anchor="middle">RECOMMENDER + CTR</text>
    <text x="160" y="572" fill="#e6ebff" font-size="11" text-anchor="middle">Collaborative filtering</text>
    <text x="160" y="590" fill="#e6ebff" font-size="11" text-anchor="middle">NDCG@10 = 0.78</text>
    <text x="160" y="608" fill="#e6ebff" font-size="11" text-anchor="middle">Hashing-trick LR CTR</text>
    <text x="160" y="626" fill="#e6ebff" font-size="11" text-anchor="middle">Trained nightly</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="320" y="520" width="240" height="120" rx="12" fill="#1c264a" stroke="#f5a623" stroke-width="2"/>
    <text x="440" y="548" fill="#f5a623" font-size="13" font-weight="700" text-anchor="middle">A/B + MAB</text>
    <text x="440" y="572" fill="#e6ebff" font-size="11" text-anchor="middle">Two-proportion z-test</text>
    <text x="440" y="590" fill="#e6ebff" font-size="11" text-anchor="middle">Thompson Sampling MAB</text>
    <text x="440" y="608" fill="#e6ebff" font-size="11" text-anchor="middle">23% conversion lift</text>
    <text x="440" y="626" fill="#e6ebff" font-size="11" text-anchor="middle">BH FDR &lt; 0.05</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="600" y="520" width="240" height="120" rx="12" fill="#1c264a" stroke="#f5a623" stroke-width="2"/>
    <text x="720" y="548" fill="#f5a623" font-size="13" font-weight="700" text-anchor="middle">CAUSAL INFERENCE</text>
    <text x="720" y="572" fill="#e6ebff" font-size="11" text-anchor="middle">Difference-in-Differences</text>
    <text x="720" y="590" fill="#e6ebff" font-size="11" text-anchor="middle">Propensity matching</text>
    <text x="720" y="608" fill="#e6ebff" font-size="11" text-anchor="middle">95% CI | cluster-robust SE</text>
    <text x="720" y="626" fill="#e6ebff" font-size="11" text-anchor="middle">Incrementality / ROAS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="880" y="520" width="320" height="120" rx="12" fill="#1c264a" stroke="#ff6b81" stroke-width="2"/>
    <text x="1040" y="548" fill="#ff6b81" font-size="13" font-weight="700" text-anchor="middle">OBSERVABILITY</text>
    <text x="1040" y="572" fill="#e6ebff" font-size="11" text-anchor="middle">Prometheus + Grafana</text>
    <text x="1040" y="590" fill="#e6ebff" font-size="11" text-anchor="middle">P50 / P95 / P99 latency</text>
    <text x="1040" y="608" fill="#e6ebff" font-size="11" text-anchor="middle">Budget pacing alerts</text>
    <text x="1040" y="626" fill="#e6ebff" font-size="11" text-anchor="middle">99.95% SLA | HPA scaling</text>
  </g>

  <text x="40" y="700" fill="#8a93b8" font-size="11">Speed layer = Kafka + Spark Streaming + Redis Feature Store | Batch layer = S3 -&gt; Airflow -&gt; DBT -&gt; Redshift -&gt; BI</text>
</svg>
