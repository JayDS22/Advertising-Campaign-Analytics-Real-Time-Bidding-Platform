name: 'ads_warehouse'
version: '1.0.0'
config-version: 2

profile: 'ads_warehouse'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  ads_warehouse:
    staging:
      +materialized: view
      +schema: staging
    marts:
      facts:
        +materialized: incremental
        +on_schema_change: append_new_columns
        +schema: marts
      dimensions:
        +materialized: table
        +schema: marts

vars:
  attribution_window_days: 30
  default_currency: 'USD'
  freshness_warn_after: { count: 6, period: hour }
  freshness_error_after: { count: 24, period: hour }
