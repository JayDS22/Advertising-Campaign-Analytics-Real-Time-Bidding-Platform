apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-rtb-api
  labels: { app: atlas-rtb-api }
spec:
  replicas: 6
  selector: { matchLabels: { app: atlas-rtb-api } }
  template:
    metadata:
      labels: { app: atlas-rtb-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: atlas-rtb:latest
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_HOST
              value: "redis-master.atlas.svc.cluster.local"
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits:   { cpu: "2",    memory: "2Gi"  }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: atlas-rtb-api }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: atlas-rtb-api
  minReplicas: 6
  maxReplicas: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
---
apiVersion: v1
kind: Service
metadata: { name: atlas-rtb-api }
spec:
  type: ClusterIP
  selector: { app: atlas-rtb-api }
  ports:
    - port: 80
      targetPort: 8000
