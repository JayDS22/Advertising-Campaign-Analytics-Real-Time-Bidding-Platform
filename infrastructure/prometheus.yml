global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: atlas-rtb
    environment: prod

rule_files:
  - alert_rules.yml

scrape_configs:
  - job_name: 'atlas-rtb-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']
  - job_name: 'kafka-msk'
    static_configs:
      - targets: ['kafka-exporter:9308']
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
